<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="100%" height="100%">
  <defs>
    <linearGradient id="dsaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="dsaCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#31104b"/>
    </linearGradient>
    <linearGradient id="adCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14532d"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="960" height="420" rx="16" fill="url(#dsaBg)"/>

  <!-- Title -->
  <text x="480" y="45" font-family="system-ui, sans-serif" font-size="22" font-weight="800" fill="#f8fafc" text-anchor="middle">
    Новітнє цифрове законодавство ЄС: платформи та реклама
  </text>
  <text x="480" y="70" font-family="system-ui, sans-serif" font-size="13" fill="#cbd5e1" text-anchor="middle">
    Як ЄС обмежує алгоритми таргетингу та маніпуляції виборами
  </text>

  <!-- Left Card: DSA -->
  <g transform="translate(50, 95)" filter="url(#cardShadow)">
    <rect width="400" height="290" rx="14" fill="#0f172a" stroke="#a855f7" stroke-width="1.5"/>
    <rect width="400" height="48" rx="14" fill="#7e22ce" fill-opacity="0.3"/>

    <text x="25" y="30" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#ffffff">Закон про цифрові послуги (DSA)</text>
    <text x="375" y="30" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#d8b4fe" text-anchor="end">Регламент (ЄС) 2022/2065</text>

    <!-- Ban 1 -->
    <g transform="translate(20, 65)">
      <rect width="360" height="60" rx="8" fill="#1e1b4b"/>
      <circle cx="25" cy="30" r="14" fill="#ef4444"/>
      <text x="25" y="35" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">✕</text>
      <text x="50" y="24" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#fca5a5">Заборона таргетингу неповнолітніх</text>
      <text x="50" y="42" font-family="system-ui, sans-serif" font-size="10" fill="#cbd5e1">Платформам категорично заборонено профілювати дітей для реклами.</text>
    </g>

    <!-- Ban 2 -->
    <g transform="translate(20, 135)">
      <rect width="360" height="60" rx="8" fill="#1e1b4b"/>
      <circle cx="25" cy="30" r="14" fill="#ef4444"/>
      <text x="25" y="35" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">✕</text>
      <text x="50" y="24" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#fca5a5">Заборона чутливих категорій даних</text>
      <text x="50" y="42" font-family="system-ui, sans-serif" font-size="10" fill="#cbd5e1">Неможливо таргетувати рекламу за здоров'ям, релігією чи орієнтацією.</text>
    </g>

    <!-- Ban 3 -->
    <g transform="translate(20, 205)">
      <rect width="360" height="60" rx="8" fill="#1e1b4b"/>
      <circle cx="25" cy="30" r="14" fill="#f59e0b"/>
      <text x="25" y="35" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">!</text>
      <text x="50" y="24" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#fcd34d">Заборона Dark Patterns</text>
      <text x="50" y="42" font-family="system-ui, sans-serif" font-size="10" fill="#cbd5e1">Заборонено оманливі інтерфейси для схиляння до згоди на трекінг.</text>
    </g>
  </g>

  <!-- Right Card: Political Advertising -->
  <g transform="translate(510, 95)" filter="url(#cardShadow)">
    <rect width="400" height="290" rx="14" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
    <rect width="400" height="48" rx="14" fill="#047857" fill-opacity="0.3"/>

    <text x="25" y="30" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#ffffff">Політична реклама</text>
    <text x="375" y="30" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#6ee7b7" text-anchor="end">Регламент (ЄС) 2024/900</text>

    <!-- Rule 1 -->
    <g transform="translate(20, 65)">
      <rect width="360" height="60" rx="8" fill="#064e3b"/>
      <circle cx="25" cy="30" r="14" fill="#10b981"/>
      <text x="25" y="35" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">✓</text>
      <text x="50" y="24" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#a7f3d0">Збір виключно напряму</text>
      <text x="50" y="42" font-family="system-ui, sans-serif" font-size="10" fill="#cbd5e1">Дані мають бути зібрані безпосередньо від суб'єкта (заборона скуповування баз).</text>
    </g>

    <!-- Rule 2 -->
    <g transform="translate(20, 135)">
      <rect width="360" height="60" rx="8" fill="#064e3b"/>
      <circle cx="25" cy="30" r="14" fill="#10b981"/>
      <text x="25" y="35" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">✓</text>
      <text x="50" y="24" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#a7f3d0">Лише явна згода (Explicit Consent)</text>
      <text x="50" y="42" font-family="system-ui, sans-serif" font-size="10" fill="#cbd5e1">Окрема, однозначна згода виключно для цілей політичної реклами.</text>
    </g>

    <!-- Rule 3 -->
    <g transform="translate(20, 205)">
      <rect width="360" height="60" rx="8" fill="#064e3b"/>
      <circle cx="25" cy="30" r="14" fill="#ef4444"/>
      <text x="25" y="35" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">✕</text>
      <text x="50" y="24" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#fca5a5">Заборона профілювання поглядів</text>
      <text x="50" y="42" font-family="system-ui, sans-serif" font-size="10" fill="#cbd5e1">Заборонено аналізувати релігійні та політичні погляди для мікротаргетингу.</text>
    </g>
  </g>
</svg>
