<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="100%" height="100%">
  <defs>
    <linearGradient id="wbBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#27272a"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a221b"/>
      <stop offset="100%" stop-color="#1c1917"/>
    </linearGradient>
    <filter id="shadowWb" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="960" height="420" rx="16" fill="url(#wbBg)"/>

  <!-- Header -->
  <text x="480" y="45" font-family="system-ui, sans-serif" font-size="22" font-weight="800" fill="#f8fafc" text-anchor="middle">
    Доктринальні витоки: народження концепції приватності (1890)
  </text>
  <text x="480" y="70" font-family="system-ui, sans-serif" font-size="13" fill="#d6d3d1" text-anchor="middle">
    Стаття Семюеля Воррена та Луїса Брандейса «The Right to Privacy» (Harvard Law Review)
  </text>

  <!-- Left: Tech Trigger -->
  <g transform="translate(50, 95)" filter="url(#shadowWb)">
    <rect width="260" height="290" rx="14" fill="url(#cardGrad)" stroke="#d97706" stroke-width="1.5"/>
    <rect width="260" height="45" rx="14" fill="#b45309" fill-opacity="0.3"/>
    
    <text x="20" y="28" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#fbbf24">1. Технологічний тригер</text>

    <text x="20" y="75" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#f59e0b">1888: Камера Kodak</text>
    <text x="20" y="95" font-family="system-ui, sans-serif" font-size="11" fill="#e7e5e4">• Портативна миттєва фотографія</text>
    <text x="20" y="112" font-family="system-ui, sans-serif" font-size="11" fill="#e7e5e4">• Зйомка без згоди людини</text>

    <text x="20" y="150" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#f59e0b">«Жовта преса»</text>
    <text x="20" y="170" font-family="system-ui, sans-serif" font-size="11" fill="#e7e5e4">• Публікація чуток і пліток</text>
    <text x="20" y="187" font-family="system-ui, sans-serif" font-size="11" fill="#e7e5e4">• Комерціалізація чужого</text>
    <text x="28" y="204" font-family="system-ui, sans-serif" font-size="11" fill="#e7e5e4">особистого життя</text>

    <rect x="15" y="235" width="230" height="35" rx="6" fill="#44403c"/>
    <text x="130" y="257" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#fde68a" text-anchor="middle">Загроза людській гідності</text>
  </g>

  <!-- Middle: The Harvard Article -->
  <g transform="translate(340, 95)" filter="url(#shadowWb)">
    <rect width="280" height="290" rx="14" fill="#1c1917" stroke="#38bdf8" stroke-width="1.5"/>
    <rect width="280" height="45" rx="14" fill="#0284c7" fill-opacity="0.3"/>

    <text x="20" y="28" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#7dd3fc">2. Стаття 1890 року</text>

    <text x="20" y="75" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#38bdf8">Автори:</text>
    <text x="20" y="95" font-family="system-ui, sans-serif" font-size="11" fill="#f8fafc">• Семюель Д. Воррен (Warren)</text>
    <text x="20" y="112" font-family="system-ui, sans-serif" font-size="11" fill="#f8fafc">• Луїс Д. Брандейс (Brandeis)</text>

    <text x="20" y="145" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#38bdf8">Маніфест концепції:</text>
    <text x="20" y="165" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">«The Right to be Let Alone»</text>
    <text x="20" y="185" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">(термін судді Т. Кулі, 1879)</text>

    <rect x="15" y="215" width="250" height="55" rx="6" fill="#0c4a6e" fill-opacity="0.4"/>
    <text x="140" y="236" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#38bdf8" text-anchor="middle">«Закон повинен захищати</text>
    <text x="140" y="254" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#38bdf8" text-anchor="middle">недоторканність особистості»</text>
  </g>

  <!-- Right: Paradigm Shift -->
  <g transform="translate(650, 95)" filter="url(#shadowWb)">
    <rect width="260" height="290" rx="14" fill="url(#cardGrad)" stroke="#10b981" stroke-width="1.5"/>
    <rect width="260" height="45" rx="14" fill="#047857" fill-opacity="0.3"/>

    <text x="20" y="28" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#6ee7b7">3. Зміна парадигми</text>

    <text x="20" y="75" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#34d399">До 1890 року:</text>
    <text x="20" y="95" font-family="system-ui, sans-serif" font-size="11" fill="#a8a29e">• Лише право власності</text>
    <text x="20" y="112" font-family="system-ui, sans-serif" font-size="11" fill="#a8a29e">• Фізичне вторгнення (trespass)</text>

    <text x="20" y="145" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#34d399">Після 1890 року:</text>
    <text x="20" y="165" font-family="system-ui, sans-serif" font-size="11" fill="#e7e5e4">• Немайнове благо людини</text>
    <text x="20" y="182" font-family="system-ui, sans-serif" font-size="11" fill="#e7e5e4">• Захист честі, репутації</text>
    <text x="28" y="199" font-family="system-ui, sans-serif" font-size="11" fill="#e7e5e4">та душевного спокою</text>

    <rect x="15" y="235" width="230" height="35" rx="6" fill="#064e3b"/>
    <text x="130" y="257" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#a7f3d0" text-anchor="middle">Фундамент для ЗДПЛ 1948</text>
  </g>
</svg>
